[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "model-spec-midtraining"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "json5",
    "simple-parsing",
    "tqdm",
    "tiktoken",
    "sentence-transformers",
    "faiss-cpu",
]

[tool.setuptools.packages.find]
include = ["src*", "evals*"]

[project.optional-dependencies]
unsloth = [
    "unsloth",
    "trl>=0.8.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "torch>=2.0.0",
]
